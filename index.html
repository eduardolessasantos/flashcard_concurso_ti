        <section>
          <h2>Disciplinas e Conteúdo Programático</h2>
          <ul>
            <li><strong>Segurança da Informação:</strong> Criptografia simétrica e assimétrica, assinaturas digitais, MFA com 3 fatores, norma ABNT NBR ISO/IEC 27002:2022 (4 temas), OWASP Top 10:2021 (Broken Access Control) e testes de segurança SAST vs DAST.</li>
            <li><strong>Governança de TI:</strong> ITIL v4 (Sistema de Valor de Serviço, Utilidade vs Garantia e os 7 Princípios Orientadores), COBIT 2019 (EDM, APO, BAI, DSS, MEA), BPMN 2.0 e Metodologias Ágeis (Scrum, XP e TDD).</li>
            <li><strong>Inteligência de Negócios e Big Data:</strong> Data Warehouses (Inmon vs Kimball), Modelagem Dimensional (Star Schema vs Snowflake), Operações OLAP (Drill-down, Roll-up, Slice, Dice, Pivot) e Data Lakes (Schema-on-Read).</li>
            <li><strong>Legislação e Proteção de Dados:</strong> Lei de Acesso à Informação (Lei 12.527/11 - LAI), Lei Geral de Proteção de Dados (Lei 13.709/18 - LGPD) e Marco Civil da Internet (Lei 12.965/14).</li>
          </ul>
