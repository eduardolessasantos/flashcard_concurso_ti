<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Stacked Background Card (SRS card illusion) -->
  <rect x="14" y="10" width="36" height="24" rx="5" fill="#312e81" stroke="#6366f1" stroke-width="1.2" opacity="0.7" transform="rotate(-6 32 22)" />
  
  <!-- Front Floating Card -->
  <rect x="12" y="14" width="40" height="38" rx="7" fill="#0f172a" stroke="url(#cardGrad)" stroke-width="2" />
  
  <!-- Top card colored header line -->
  <rect x="16" y="18" width="32" height="4" rx="2" fill="url(#cardGrad)" />
  
  <!-- IT Monogram / Dev Brand Text -->
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">IT</text>
  
  <!-- Bottom card accent dots / SRS mastery pills -->
  <circle cx="24" cy="45" r="2" fill="#38bdf8" />
  <circle cx="32" cy="45" r="2" fill="#818cf8" />
  <circle cx="40" cy="45" r="2" fill="url(#accentGrad)" />
</svg>
